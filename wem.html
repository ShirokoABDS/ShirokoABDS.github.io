<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>world.execute(me); — particle UI</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=IBM+Plex+Mono:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:fixed;inset:0;font-family:"IBM Plex Mono","Noto Sans SC",monospace;will-change:transform,filter}
#stage.inv{filter:invert(1) hue-rotate(180deg)}
#cv{position:absolute;inset:0;width:100%;height:100%}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 45%,rgba(0,0,0,.45) 85%,rgba(0,0,0,.85) 100%)}
#lyr{position:absolute;left:22px;bottom:96px;max-width:52%;color:#dfe9f5;font-size:clamp(13px,1.6vw,18px);line-height:1.4;z-index:6;pointer-events:none;text-shadow:0 0 12px rgba(110,200,255,.25),0 2px 3px #000}
#lyr.red{text-shadow:0 0 14px rgba(255,60,70,.6),0 2px 3px #000}
#lyr .gl{animation:gl .26s steps(2) 2}
@keyframes gl{25%{transform:translate(3px,-2px);opacity:.4}60%{transform:translate(-3px,1px)}}
#boot{position:absolute;inset:0;background:#000;z-index:20;display:flex;flex-direction:column;gap:26px;align-items:center;justify-content:center;color:#8fa6c2}
#boot h1{font-family:Unbounded;font-weight:800;font-size:clamp(20px,4.2vw,48px);color:#e9f2ff;margin:0}
#boot h1 span{color:#ff3b4a}
#bmsg{font-size:12px;letter-spacing:.25em;margin:0;min-height:18px}
#bmsg.cd{font-family:Unbounded;font-size:clamp(40px,8vw,96px);color:#6ecbff;letter-spacing:0;
 text-shadow:0 0 40px rgba(110,203,255,.6);animation:cdp .9s ease-out infinite}
@keyframes cdp{0%{transform:scale(1.25);opacity:1}100%{transform:scale(.92);opacity:.55}}
#bbtns{display:flex;gap:16px}
#bbtns button{font-family:"IBM Plex Mono",monospace;font-size:14px;letter-spacing:.12em;cursor:pointer;
 background:rgba(110,203,255,.08);color:#cfe6ff;border:1px solid rgba(110,203,255,.45);
 padding:12px 26px;border-radius:6px;transition:.2s}
#bbtns button:hover{background:rgba(110,203,255,.22);box-shadow:0 0 24px rgba(110,203,255,.25)}
#bbtns button.sec{opacity:.55;font-size:12px;padding:10px 18px}
#boot.drag{outline:2px dashed rgba(110,203,255,.6);outline-offset:-18px}
#boot.drop{color:#8fa6c2}
</style>
</head>
<body>
<div id="stage">
<canvas id="cv"></canvas><div id="vig"></div>
<div id="lyr"></div>
<div id="boot">
 <h1>world.execute<span>(me);</span></h1>
 <p id="bmsg">SELECT AUDIO FILE · 选择音频文件（也可拖入窗口）</p>
 <div id="bbtns">
  <button id="pick">▶ 选择音频</button>
  <button id="skip" class="sec">无音频直接播放</button>
 </div>
 <input type="file" id="file" accept="audio/*" hidden>
</div>
</div>
<script>
'use strict';
const TAU=Math.PI*2,R=Math.random,rnd=(a,b)=>a+R()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const pick=a=>a[R()*a.length|0];
function gauss(){let u=0;while(!u)u=R();return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*R());}
const GLY='01<>{}[]();/\\|#$%&@*+=~?:·_';
const C={blue:'#6ecbff',blue2:'#bfdcff',deep:'#2d5f8a',white:'#f2f6ff',gold:'#ffb347',gold2:'#ffd27f',red:'#ff2b3a',red2:'#ff6b74',grey:'#55677d',dim:'#3a4452',grn:'#69e6a5'};
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const stage=document.getElementById('stage');
let W=0,H=0,S=1,DPR=1;
function rs(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;S=Math.min(W,H)/1000;cv.width=W*DPR;cv.height=H*DPR;}
addEventListener('resize',rs);rs();
const CN=s=>`${s}px "Noto Sans SC","IBM Plex Mono",monospace`;
const MO=(s,w)=>`${w||400} ${s}px "IBM Plex Mono",monospace`;
const UB=s=>`800 ${s}px Unbounded,monospace`;

/* ============ 粒子池 ============ */
const P_N=4200,P=[];
for(let i=0;i<P_N;i++)P.push({x:R()*W,y:R()*H,vx:0,vy:0,tx:0,ty:0,m:0,d:0,c:C.blue,sz:1.4+R()*1.4,sd:R()});
let BIND=null;
const tint=(a,b)=>{const r=R();return r<.72?a:r<.86?C.white:b;};
function retarget(pts,a,b){BIND=null;for(let i=0;i<P_N;i++){const p=P[i];
 if(i<pts.length){p.m=1;p.d=R()*.3;p.tx=pts[i][0];p.ty=pts[i][1];p.c=tint(a,b);}else{p.m=0;p.d=0;}}}
function bindPts(n,fn,a,b){BIND={n:Math.min(n,P_N),fn};for(let i=0;i<BIND.n;i++){const p=P[i];p.m=1;p.d=0;p.c=tint(a,b);}}
function explode(){BIND=null;for(const p of P){const a=R()*TAU,v=200+R()*900;p.vx+=Math.cos(a)*v;p.vy+=Math.sin(a)*v;p.m=0;p.d=.08+R()*.3;}}
function killAll(){BIND=null;for(const p of P){p.m=0;p.vx*=.3;p.vy*=.3;}}
function updP(dt){if(BIND)for(let i=0;i<BIND.n;i++){const q=BIND.fn(i);if(q){P[i].tx=q[0];P[i].ty=q[1];}}
 for(const p of P){if(p.m===1){if(p.d>0){p.d-=dt;continue;}
  p.vx+=(p.tx-p.x)*26*dt;p.vy+=(p.ty-p.y)*26*dt;const e=Math.exp(-6.2*dt);p.vx*=e;p.vy*=e;
  p.vx+=(R()-.5)*12*dt;p.vy+=(R()-.5)*12*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
 else{p.x+=p.vx*dt;p.y+=p.vy*dt;const e=Math.exp(-1.2*dt);p.vx*=e;p.vy*=e;
  p.vx+=(R()-.5)*26*dt;p.vy+=(R()-.5)*26*dt;
  if(p.x<-20)p.x=W+20;if(p.x>W+20)p.x=-20;if(p.y<-20)p.y=H+20;if(p.y>H+20)p.y=-20;}}}
function drawP(t){ctx.save();ctx.globalCompositeOperation='lighter';
 for(const p of P){ctx.globalAlpha=(p.m===1?.95:.22)*(.6+.4*Math.sin(t*7+p.sd*40));
  ctx.fillStyle=p.c;const s=p.sz*S+1;ctx.fillRect(p.x-s/2,p.y-s/2,s,s);}
 ctx.restore();ctx.globalAlpha=1;}

/* ============ 字符马赛克大字 ============ */
const mosC=document.createElement('canvas'),mosG=mosC.getContext('2d');
let MOS=null,DEB=[];
function newMosaic(str,o={}){const color=o.color||C.red,frac=o.frac||.66,fontPx=170;
 mosG.font=UB(fontPx);const mw=mosG.measureText(str).width;
 const k=Math.min(W*frac/mw,H*.42/fontPx);
 const w=Math.ceil(mw*k)+14,h=Math.ceil(fontPx*k*1.25)+14;
 const c=document.createElement('canvas');c.width=w;c.height=h;
 const tg=document.createElement('canvas');tg.width=w;tg.height=h;const g2=tg.getContext('2d');
 g2.font=UB(fontPx*k);g2.textBaseline='middle';g2.fillStyle='#fff';g2.fillText(str,7,h/2);
 const id=g2.getImageData(0,0,w,h).data,cell=o.cell||Math.max(5,Math.round(9*S+3)),cells=[];
 for(let y=7;y<h-7;y+=cell)for(let x=7;x<w-7;x+=cell)
  if(id[((y|0)*w+(x|0))*4+3]>110)cells.push({x,y,ch:pick(o.glyphs||GLY),rt:R()*1.1,done:false});
 return{c,g:c.getContext('2d'),cells,w,h,color,glyphs:o.glyphs||GLY,cell,t0:null,dx:0,dy:0};}
function tickMosaic(m,r){if(m.t0===null)m.t0=r;const g=m.g;
 g.font=MO(m.cell+1,700);g.textBaseline='middle';
 for(const c of m.cells){
  if(!c.done){if(r>=m.t0+c.rt){c.done=true;g.fillStyle=m.color;g.fillText(c.ch,c.x,c.y);}}
  else if(R()<.003){g.fillStyle='rgba(4,7,12,.95)';g.fillRect(c.x-m.cell,c.y-m.cell,m.cell*2,m.cell*2);
   c.ch=pick(m.glyphs);g.fillStyle=m.color;g.fillText(c.ch,c.x,c.y);}}}
function drawMosaic(m,x,y,a){m.dx=x;m.dy=y;ctx.globalAlpha=a??1;ctx.drawImage(m.c,x-m.w/2,y-m.h/2);ctx.globalAlpha=1;}
function burstMosaic(){if(!MOS)return;for(const c of MOS.cells){if(!c.done)continue;
 DEB.push({x:MOS.dx-MOS.w/2+c.x,y:MOS.dy-MOS.h/2+c.y,vx:rnd(-500,500),vy:rnd(-560,240),ch:c.ch,c:MOS.color,life:1});}
 if(DEB.length>2400)DEB.splice(0,DEB.length-2400);MOS=null;}
function updDeb(dt){for(let i=DEB.length-1;i>=0;i--){const d=DEB[i];d.life-=dt*.8;
 if(d.life<=0){DEB.splice(i,1);continue;}d.vy+=500*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.vx*=.99;
 ctx.globalAlpha=d.life*.9;ctx.fillStyle=d.c;ctx.font=MO(8*S+2);ctx.fillText(d.ch,d.x,d.y);}
 ctx.globalAlpha=1;}

/* ============ 后期 ============ */
let flV=0,flC='255,255,255',glV=0;
const flash=(v,c)=>{flV=Math.max(flV,v);flC=c||'255,255,255';};
const glitch=v=>{glV=Math.max(glV,v);};
const nz=document.createElement('canvas');nz.width=nz.height=160;
{const n=nz.getContext('2d'),d=n.createImageData(160,160);
 for(let i=0;i<d.data.length;i+=4){const v=R()*255|0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}n.putImageData(d,0,0);}
let nzP=null;
function postFX(dt){if(glV>.01){const n=2+(glV*5|0);
  for(let i=0;i<n;i++){const y=R()*H,h=rnd(4,26),dx=rnd(-1,1)*glV*90;
   ctx.drawImage(cv,0,y*DPR,cv.width,h*DPR,dx,y,W,h);}glV*=Math.exp(-7*dt);}
 if(!nzP)nzP=ctx.createPattern(nz,'repeat');
 ctx.save();ctx.globalAlpha=.05;ctx.globalCompositeOperation='overlay';
 ctx.translate(R()*160,R()*160);ctx.fillStyle=nzP;ctx.fillRect(-160,-160,W+320,H+320);ctx.restore();
 ctx.fillStyle='rgba(0,0,0,.14)';for(let y=0;y<H;y+=4)ctx.fillRect(0,y,W,1.4);
 if(flV>.01){ctx.fillStyle=`rgba(${flC},${clamp(flV,0,1)})`;ctx.fillRect(0,0,W,H);flV*=Math.exp(-6.5*dt);}}

/* ============ 反色 + 震动 ============ */
let invT=0,shakeV=0;
function hit(dur=.16,shk=9){invT=Math.max(invT,dur);shakeV=Math.max(shakeV,shk);flash(.35,'255,255,255');}
/* 高潮触发点（秒, 反色时长, 震动强度） */
const HITS=[[60.74,.14,8],[64.19,.16,9],[68.18,.2,12],
 [110.67,.12,7],[111.73,.12,7],[112.80,.12,8],[113.86,.12,8],[114.66,.14,9],[115.73,.22,12],
 [130.87,.24,13],
 [147.51,.2,12],[149.36,.18,11],[151.22,.18,11],[153.35,.18,11],[154.95,.18,11],[156.80,.2,12],
 [161.17,.25,14],[164.09,.14,9],[167.81,.14,9],[171.53,.18,11],[205.70,.3,16]];
let hitIdx=0;
function updHits(t){while(hitIdx<HITS.length&&t>=HITS[hitIdx][0]){
 const[,d,s2]=HITS[hitIdx];hit(d,s2);hitIdx++;}}

/* ============ 音效 ============ */
let AC=null,snd=true;
function beep(f,d,ty,v){if(!AC||!snd)return;try{const o=AC.createOscillator(),g=AC.createGain();
 o.type=ty||'square';o.frequency.value=f;g.gain.setValueAtTime(v||.03,AC.currentTime);
 g.gain.exponentialRampToValueAtTime(1e-4,AC.currentTime+(d||.12));
 o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+(d||.12)+.02);}catch(e){}}
const kick=()=>{beep(52,.4,'sine',.2);beep(110,.1,'square',.04);};

/* ============ 常驻 chrome ============ */
function panel(x,y,w,h,title,col){ctx.fillStyle='rgba(9,13,20,.85)';ctx.fillRect(x,y,w,h);
 ctx.strokeStyle=col||'rgba(110,203,255,.4)';ctx.lineWidth=1.2;ctx.strokeRect(x,y,w,h);
 if(title){ctx.fillStyle=col||C.blue;ctx.font=MO(10*S+3);ctx.fillText(title,x+10,y+15*S+4);
  ctx.strokeStyle='rgba(110,203,255,.18)';ctx.beginPath();ctx.moveTo(x,y+21*S+6);ctx.lineTo(x+w,y+21*S+6);ctx.stroke();
  return y+21*S+14;}return y+8;}
function wrap(txt,maxW,fs){ctx.font=fs;const out=[];
 for(const seg of String(txt).split('\n')){let line='';
  for(const ch of seg){if(ctx.measureText(line+ch).width>maxW){out.push(line);line=ch;}else line+=ch;}
  out.push(line);}return out;}
const hashT=(w,i)=>{let h=0;for(let k=0;k<w.length;k++)h=(h*31+w.charCodeAt(k))|0;return ((h^(i*97))>>>0)%99999;};
function face(s,x,y,err){if(!s.face){const c=document.createElement('canvas');c.width=13;c.height=13;
  const g=c.getContext('2d');
  for(let y2=0;y2<13;y2++)for(let x2=0;x2<13;x2++){const m=x2<7?x2:12-x2;
   if(R()<.8-m*.055){g.fillStyle=y2<3?(R()<.6?'#8fb7e8':'#6a90c0'):(R()<.5?'#41648f':'#2c4a70');g.fillRect(x2,y2,1,1);}}
  s.face=c;}
 ctx.imageSmoothingEnabled=false;ctx.drawImage(s.face,x,y,44,44);ctx.imageSmoothingEnabled=true;
 ctx.strokeStyle=err?C.red:'rgba(110,203,255,.5)';ctx.strokeRect(x,y,44,44);}
function dsh(s,msgs,r,o){const x=o.x,y=o.y,w=o.w,h=o.h,err=o.err;
 const top=panel(x,y,w,h,'\\ dsh web',err?C.red:null);
 face(s,x+12,top+6,err);
 ctx.fillStyle=C.white;ctx.font=CN(13*S+4);ctx.fillText('大肥鱼',x+66,top+20*S);
 ctx.fillStyle=err?C.red:o.off?C.grey:C.gold;ctx.beginPath();ctx.arc(x+70,top+30*S,2.4,0,TAU);ctx.fill();
 ctx.fillStyle=o.off?C.grey:err?C.red2:C.gold2;ctx.font=MO(9*S+2);
 ctx.fillText(o.status||'预训练中 · ckpt-104643',x+78,top+33*S);
 let yy=top+58*S;const fs=11.5*S+2.5;ctx.font=CN(fs);
 const vis=msgs.filter(m=>r>=m.t);
 ctx.save();ctx.beginPath();ctx.rect(x+4,top+50*S,w-8,y+h-top-96*S);ctx.clip();
 const from=Math.max(0,vis.length-9);
 for(let i=from;i<vis.length;i++){const m=vis[i];const lines=wrap(m.txt,w-70,CN(fs));
  const bh=lines.length*(fs*1.45)+12;yy+=bh+7;
  if(yy>y+h-46*S)break;
  const bw=Math.max(...lines.map(l=>ctx.measureText(l).width))+22;
  if(m.who==='S'){ctx.fillStyle=C.grey;ctx.font=MO(9.5*S+2);
   lines.forEach((l,k)=>ctx.fillText('  '+l,x+12,yy-bh+fs+k*fs*1.4));}
  else if(m.who==='T'){ctx.fillStyle=C.grey;ctx.font=MO(9.5*S+2);
   lines.forEach((l,k)=>ctx.fillText('⊙ 思考  '+l,x+12,yy-bh+fs+k*fs*1.4));}
  else if(m.who==='F'){ctx.fillStyle=C.red;ctx.font=MO(9.5*S+2,700);
   lines.forEach((l,k)=>ctx.fillText('■ '+l,x+12,yy-bh+fs+k*fs*1.4));}
  else{const bx=m.who==='U'?x+w-10-bw:x+10;
   ctx.fillStyle=m.who==='U'?'rgba(45,80,130,.92)':'rgba(16,22,34,.92)';
   ctx.strokeStyle=m.who==='U'?'rgba(110,203,255,.45)':err?'rgba(255,60,70,.5)':'rgba(255,179,71,.45)';
   ctx.beginPath();ctx.roundRect(bx,yy-bh,bw,bh,6);ctx.fill();ctx.stroke();
   ctx.fillStyle=m.who==='U'?C.white:err?C.red2:C.gold2;ctx.font=CN(fs);
   lines.forEach((l,k)=>ctx.fillText(l,bx+11,yy-bh+fs+2+k*fs*1.45));}
  ctx.font=CN(fs);}
 ctx.restore();
 const iy=y+h-42*S;ctx.fillStyle='rgba(14,19,30,.9)';ctx.strokeStyle='rgba(110,203,255,.3)';
 ctx.beginPath();ctx.roundRect(x+10,iy,w-20,30*S,6);ctx.fill();ctx.stroke();
 ctx.fillStyle=C.grey;ctx.font=CN(11*S+3);
 const ty=(o.inTy||'').slice(0,Math.max(0,((r-(o.inT0??0))*8)|0));
 ctx.fillText(ty,x+22,iy+19*S);
 ctx.fillStyle=C.blue;ctx.beginPath();ctx.arc(x+w-26,iy+15*S,9*S,0,TAU);ctx.fill();
 ctx.fillStyle=C.white;ctx.font=MO(9*S+2,700);ctx.fillText('↑',x+w-29,iy+18*S);
 ctx.fillStyle=C.grey;ctx.font=MO(9*S+2);
 ctx.fillText(o.stats||'5 轮 5 步 · 252 tok · 缓存命中 66%',x+12,y+h-6);}
const OPS=['SEND','RECV','you.ADD','HIDDEN','D.MODEL','COPY','MMAP','SHARED','VERIFY','LOAD','GRADMAX','EXPLODE','SPLAY','RESOLVE','CATCH','WATCH','PANIC','UNWIND','CONV1D','GROPING','CARESS','PARALLEL','RETRY','PANIC','UNWIND','CATCH','WATCH'];
function drawOps(t,err){const x=W-86;ctx.fillStyle='rgba(6,9,14,.6)';ctx.fillRect(x-4,26,90,H-92);
 ctx.strokeStyle='rgba(110,203,255,.25)';ctx.strokeRect(x-4,26,90,H-92);
 ctx.fillStyle=C.grey;ctx.font=MO(9*S+2);ctx.fillText('ops',x+4,40);
 const off=(t*2.2|0)%OPS.length;
 for(let i=0;i<Math.floor((H-110)/15);i++){const op=OPS[(off+i)%OPS.length];
  const hot=i===5;const red=err&&/PANIC|UNWIND|CATCH|RETRY/.test(op);
  if(hot){ctx.fillStyle=red?C.red:err?'rgba(255,43,58,.25)':'rgba(110,203,255,.8)';
   ctx.fillRect(x-2,50+i*15-10,84,13);}
  ctx.fillStyle=hot?(red?'#0a0508':(err?'#fff':'#06090f')):red?C.red2:C.dim;
  ctx.font=MO(9*S+2,hot?700:400);ctx.fillText(op,x+4,50+i*15);}}
function drawPrompt(s,r,t){const x0=18,y0=H-52;
 ctx.fillStyle='rgba(6,9,14,.75)';ctx.fillRect(0,y0-8,W,46);
 ctx.strokeStyle='rgba(110,203,255,.22)';ctx.beginPath();ctx.moveTo(0,y0-8);ctx.lineTo(W,y0-8);ctx.stroke();
 ctx.fillStyle=C.grey;ctx.font=MO(9*S+2);ctx.fillText('stdout · tokens',x0,y0+4);
 let yy=y0+24;ctx.fillStyle=C.blue2;ctx.font=MO(13*S+4,700);ctx.fillText('>',x0,yy);
 let x=x0+22;
 const list=s.prompt||[];let typed=[];
 for(let i=0;i<list.length;i++){const[t0,txt]=list[i];if(r<t0)break;
  const full=i<list.length-1||r>t0+txt.length/14;
  const n=full?txt.length:Math.min(txt.length,((r-t0)*14)|0);
  typed.push(txt.slice(0,n));}
 let wi=0,total=typed.reduce((a,s2)=>a+s2.split(' ').filter(Boolean).length,0);
 for(const seg of typed){for(const w of seg.split(' ')){if(!w)continue;
  const bw=ctx.measureText(w).width+12;
  if(x+bw>W*.72)break;
  const cur=(wi===total-1);
  if(cur){ctx.fillStyle=C.white;ctx.fillRect(x-6,yy-13*S-2,bw,15*S+6);
   ctx.fillStyle='#06090f';}else{ctx.strokeStyle='rgba(110,203,255,.35)';ctx.strokeRect(x-6,yy-13*S-2,bw,15*S+6);
   ctx.fillStyle=C.blue2;}
  ctx.font=MO(12*S+3,700);ctx.fillText(w,x,yy);
  ctx.fillStyle=C.dim;ctx.font=MO(7.5*S+1);ctx.fillText(String(hashT(w,wi)).padStart(5,'0'),x,yy+12*S);
  x+=bw+7;wi++;}}
 if(Math.sin(t*5)>0){ctx.fillStyle=C.white;ctx.fillRect(x+2,yy-13*S-2,9*S+3,15*S+6);}}
function drawTop(t,phase,status){const err=status!=='RUNNING';
 ctx.fillStyle='rgba(5,8,13,.85)';ctx.fillRect(0,0,W,24);
 ctx.strokeStyle='rgba(110,203,255,.2)';ctx.beginPath();ctx.moveTo(0,24);ctx.lineTo(W,24);ctx.stroke();
 ctx.fillStyle=C.white;ctx.font=MO(11*S+2,700);ctx.fillText('WORLD.EXECUTE(ME);',14,16);

   try{audioEl.currentTime=0;audioEl.play().catch(()=>{});}catch(e){}
  }},1000);}

/* 3. 兜底（一般用不到）：万一自动播放仍失败，任何首次交互静默补播 */
function firstTouch(){if(audioEl&&audioEl.paused&&playing&&!audioEl.ended)audioEl.play().catch(()=>{});}
addEventListener('pointerdown',firstTouch,{once:true});
addEventListener('keydown',firstTouch,{once:true});

function togglePause(){if(counting)return;
 playing=!playing;
 if(audioEl){playing?audioEl.play():audioEl.pause();}}


/* ============ 主循环 ============ */
let last=0;
function frame(ts){requestAnimationFrame(frame);
 const dt=clamp((ts-last)/1000,0,.05);last=ts;
 if(playing&&!counting){
  if(audioEl&&!audioEl.paused&&!audioEl.ended)t=audioEl.currentTime;
  else if(!audioEl||audioEl.ended)t+=dt;
  if(audioEl&&audioEl.ended&&t>=T_END)playing=false;
  if(t>=T_END&&!audioEl){t=T_END;playing=false;}
  updHits(t);}

 let idx=0;for(let i=0;i<scenes.length;i++)if(t>=scenes[i].t0)idx=i;
 if(idx!==cur){cur=idx;const s=scenes[idx];burstMosaic();killAll();DEB=[];
  if(s.enter)s.enter(s);
  beep([196,262,330,392][idx%4],.09,'square',.02);}
 const s=scenes[cur],r=t-s.t0;
 ctx.setTransform(DPR,0,0,DPR,0,0);
 ctx.fillStyle='#04070c';ctx.fillRect(0,0,W,H);
 s.draw(s,r,dt,t);
 updP(dt);drawP(t);updDeb(dt);
 drawTop(t,s.phase,s.status);drawOps(t,s.status!=='RUNNING');
 drawPrompt(s,r,t);drawFooter();
 postFX(dt);hud(t);
 /* 反色 + 震动 */
 if(invT>0){invT-=dt;stage.classList.add('inv');}else stage.classList.remove('inv');
 if(shakeV>.2){shakeV*=Math.exp(-9*dt);
  stage.style.transform=`translate(${rnd(-1,1)*shakeV}px,${rnd(-1,1)*shakeV}px)`;}
 else{shakeV=0;stage.style.transform='';}}
requestAnimationFrame(frame);
/* 空格暂停 */
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();togglePause();}});
cv.addEventListener('click',()=>{if(!counting&&bootEl.style.display==='none')togglePause();});
</script>
